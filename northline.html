x;letter-spacing:.1em;color:#888}main{min-height:80vh;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;padding:7vh 8vw;gap:6vw;position:relative}.eyebrow{font-size:10px;letter-spacing:.18em;color:#ff6a00}h1{font-size:clamp(60px,8vw,120px);line-height:.86;letter-spacing:-.07em;margin:22px 0}h1 br+p{}p{max-width:460px;line-height:1.7;color:#999}.btn{display:inline-block;margin-top:22px;padding:14px 20px;background:#ff6a00;color:#080808;text-decoration:none;font-size:12px;font-weight:800;border-radius:8px;box-shadow:0 12px 35px rgba(255,106,0,.16);transition:transform .25s,box-shadow .25s}.btn:hover{transform:translateY(-3px);box-shadow:0 18px 45px rgba(255,106,0,.25)}.visual{height:560px;background:linear-gradient(145deg,#21150d,#0d0d0d);border:1px solid #333;border-radius:220px 220px 20px 20px;position:relative;overflow:hidden;box-shadow:0 35px 90px rgba(0,0,0,.5)}.visual:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:#ff6a00;opacity:.09;right:8%;top:10%;filter:blur(3px);animation:orb 6s ease-in-out infinite}.cup{position:absolute;width:220px;height:180px;border-radius:20px 20px 70px 70px;background:#1c1c1c;border:1px solid #555;left:50%;top:52%;transform:translate(-50%,-50%) rotate(-8deg);box-shadow:20px 30px 50px #000;animation:float 5s ease-in-out infinite}.cup:before{content:"N";position:absolute;inset:0;display:grid;place-items:center;font-size:58px;font-weight:800;color:#ff6a00}.cup:after{content:'';position:absolute;right:-55px;top:30px;width:75px;height:80px;border:18px solid #1c1c1c;border-left:0;border-radius:0 60px 60px 0}.steam{position:absolute;width:2px;height:130px;background:#ff6a00;left:47%;top:18%;transform:rotate(8deg);animation:steam 3.5s ease-in-out infinite}.visual:before{content:"COFFEE / BAKERY";position:absolute;left:28px;bottom:24px;color:#777;font-size:9px;letter-spacing:.18em}@media(max-width:800px){main{grid-template-columns:1fr;padding-top:6vh}.visual{height:380px}nav{display:none}}</style></head><body><header><strong>NORTHLINE</strong><nav><span>MENU</span><span>ABOUT</span><span>CONTACT</span></nav></header><main><section><div class="eyebrow">COFFEE · BAKERY · DAILY RITUAL</div><h1>Slow down.<br>Stay awhile.</h1><p>Thoughtful coffee, fresh bakery, and a place designed for the everyday pause. A fictional Nova Web AI concept for a modern neighborhood café.</p><a class="btn" href="#menu">Explore the menu ↗</a></section><div class="visual"><div class="steam"></div><div class="cup"></div></div></main></body></html>
