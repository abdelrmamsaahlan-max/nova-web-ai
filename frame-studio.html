<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Frame Studio — Concept</title><style>*{box-sizing:border-box}body{margin:0;background:#e9e7e2;color:#101010;font-family:Arial,sans-serif}header{display:flex;justify-content:space-between;padding:28px 5vw;font-size:12px;letter-spacing:.1em}main{padding:7vh 7vw}.hero{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #aaa;padding-bottom:50px}.eyebrow{font-size:11px;letter-spacing:.18em;color:#666}h1{font-size:clamp(70px,12vw,170px);line-height:.8;letter-spacing:-.09em;margin:25px 0 0}.year{font-size:12px}.gallery{display:grid;grid-template-columns:1fr 1.5fr;gap:18px;margin-top:24px}.card{min-height:370px;background:#171717;position:relative;overflow:hidden}.card:nth-child(2){background:linear-gradient(135deg,#b9c2ce,#474d58)}.circle{position:absolute;width:230px;height:230px;border-radius:50%;background:#f4f0e7;left:50%;top:50%;transform:translate(-50%,-50%)}.card:nth-child(2):after{content:'CREATIVE\A DIRECTION';white-space:pre;position:absolute;left:30px;bottom:25px;color:white;font-weight:700;font-size:26px;line-height:.9}@media(max-width:800px){.hero{display:block}.gallery{grid-template-columns:1fr}.card{min-height:280px}}</style></head><body><header><strong>FRAME / STUDIO</strong><span>CREATIVE DIRECTION · 2026</span></header><main><div class="hero"><div><div class="eyebrow">INDEPENDENT CREATIVE STUDIO</div><h1>Make<br>an impact.</h1></div><div class="year">SELECTED WORK ↗</div></div><div class="gallery"><div class="card"><div class="circle"></div></div><div class="card"></div></div></main></body></html>
