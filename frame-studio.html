<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Frame Studio — Concept</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}html{background:#050505;color:#f5f5f5}body{margin:0;min-height:100vh;background:#050505;color:#f5f5f5;font-family:Inter,Arial,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:-20%;z-index:-3;background:radial-gradient(circle at 20% 20%,rgba(255,106,0,.14),transparent 26%),radial-gradient(circle at 80% 70%,rgba(255,106,0,.08),transparent 24%);animation:drift 17s ease-in-out infinite alternate;pointer-events:none}body:after{content:"";position:fixed;inset:0;z-index:-2;background-image:linear-gradient(rgba(255,106,0,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,106,0,.04) 1px,transparent 1px);background-size:64px 64px;animation:grid 20s linear infinite;pointer-events:none}@keyframes drift{to{transform:translate3d(-2%,3%,0) scale(1.05)}}@keyframes grid{to{background-position:64px 64px}}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes pulse{0%,100%{box-shadow:0 0 0 rgba(255,106,0,0)}50%{box-shadow:0 0 60px rgba(255,106,0,.28)}}header{display:flex;justify-content:space-between;padding:28px 5vw;font-size:12px;letter-spacing:.1em;border-bottom:1px solid #222;background:rgba(5,5,5,.72);backdrop-filter:blur(16px);position:relative;z-index:2}header strong{font-size:13px}header span{color:#777}main{padding:7vh 7vw;position:relative}.hero{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid #292929;padding-bottom:50px}.eyebrow{font-size:10px;letter-spacing:.18em;color:#ff6a00}.year{font-size:11px;color:#777}h1{font-size:clamp(70px,12vw,170px);line-height:.8;letter-spacing:-.09em;margin:25px 0 0}h1:after{content:"";display:inline-block;width:16px;height:16px;background:#ff6a00;border-radius:50%;margin-left:12px;box-shadow:0 0 30px rgba(255,106,0,.35);animation:pulse 2.5s infinite}.gallery{display:grid;grid-template-columns:1fr 1.5fr;gap:18px;margin-top:24px}.card{min-height:370px;background:#0d0d0d;border:1px solid #292929;position:relative;overflow:hidden;border-radius:14px;transition:transform .35s,border-color .35s,box-shadow .35s}.card:hover{transform:translateY(-7px);border-color:#ff6a00;box-shadow:0 25px 60px rgba(0,0,0,.4)}.card:nth-child(2){background:linear-gradient(135deg,#1d130c,#0a0a0a)}.circle{position:absolute;width:230px;height:230px;border-radius:50%;background:#151515;border:1px solid #555;left:50%;top:50%;transform:translate(-50%,-50%);animation:spin 16s linear infinite}.circle:before,.circle:after{content:"";position:absolute;border-radius:50%;background:#ff6a00}.circle:before{width:90px;height:90px;left:70px;top:70px;box-shadow:0 0 55px rgba(255,106,0,.3)}.circle:after{width:8px;height:8px;left:20px;top:28px;box-shadow:0 0 18px #ff6a00}.card:nth-child(2):after{content:'CREATIVE\\A DIRECTION';white-space:pre;position:absolute;left:30px;bottom:25px;color:#ff6a00;font-weight:800;font-size:26px;line-height:.9}.card:nth-child(2):before{content:"FRAME / 02";position:absolute;right:25px;top:24px;color:#777;font-size:9px;letter-spacing:.14em}@media(max-width:800px){.hero{display:block}.gallery{grid-template-columns:1fr}.card{min-height:280px}.year{margin-top:20px}}</style></head><body><header><strong>FRAME / STUDIO</strong><span>CREATIVE DIRECTION · 2026</span></header><main><div class="hero"><div><div class="eyebrow">INDEPENDENT CREATIVE STUDIO</div><h1>Make<br>an impact.</h1></div><div class="year">SELECTED WORK ↗</div></div><div class="gallery"><div class="card"><div class="circle"></div></div><div class="card"></div></div></main></body></html>
